name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the mod version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "$version" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$declared"
            exit 1
          fi

      - name: Extract the changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry for $version"
            exit 1
          fi

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/restrictedcells-*.jar --title "$GITHUB_REF_NAME" --notes-file notes.md
